[build]
  publish = "dist"
  command = "npm run build"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://studysync-hmji.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application fallback for React Router / client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
