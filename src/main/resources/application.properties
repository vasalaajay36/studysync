spring.application.name=studysync

# MySQL database settings (supports Aiven MySQL, or local MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studysync_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Port injection (Render provides PORT; defaults to 8080 locally)
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Session cookie hardening (supports cross-origin HTTPS deployments)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.name=STUDYSYNC_SESSION

# CORS allowed origins (comma-separated list, or left empty to use defaults)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
