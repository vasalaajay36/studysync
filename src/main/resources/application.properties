spring.application.name=studysync

# PostgreSQL database settings (supports Render DATABASE_URL, DB_URL, or standard SPRING_DATASOURCE_* vars)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studysync_db}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${USER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Port injection (Render provides PORT, e.g. 10000; defaults to 8080 locally)
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Session cookie hardening (supports cross-origin HTTPS deployments)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.name=STUDYSYNC_SESSION

# CORS allowed origins (comma-separated list, or left empty to use defaults)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
