services:
  - type: web
    name: studysync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70.0"
