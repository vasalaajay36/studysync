name: Bug report
description: Report a reproducible StudySync problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please do not include passwords, session cookies, access tokens, or private student data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in... 2. Open... 3. Click..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: Remove personal information and secrets before posting.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Dashboard / Analytics
        - Tasks
        - Subjects
        - Study sessions / Timer
        - Coding profiles
        - Deployment / Database
        - Other
    validations:
      required: true
